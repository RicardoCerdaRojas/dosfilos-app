  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "¿Preach escribe el sermón por mí?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. Preach está diseñado para acompañar tu proceso de estudio, no para reemplazarlo. Puede ayudarte a organizar observaciones, consultar fuentes, estructurar bosquejos y preparar notas, pero el discernimiento, la evaluación teológica y la predicación siguen siendo responsabilidad del ministro."
        }
      },
      {
        "@type": "Question",
        "name": "¿Puedo confiar en las respuestas?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Preach responde con referencias trazables cada vez que consulta tu biblioteca o los recursos disponibles: autor, título y página. Aun así, toda respuesta debe ser revisada por el usuario, especialmente en temas doctrinales, exegéticos o pastoralmente sensibles."
        }
      },
      {
        "@type": "Question",
        "name": "¿Qué significa que el sistema tiene citas con estándar académico?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Cada respuesta del tutor cita sus fuentes indicando autor, título y página exacta. La referencia es rastreable al documento original que tú subiste o que vive en la biblioteca especializada. La bibliografía completa aparece al pie de cada consulta."
        }
      },
      {
        "@type": "Question",
        "name": "¿Pueden usar mi contenido para entrenar modelos?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. Tu biblioteca personal es privada, aislada por usuario y nunca se usa para entrenar modelos. El modelo que consulta tu contenido lo hace solo en el momento de responder tu pregunta; no persiste esa información fuera de tu cuenta."
        }
      },
      {
        "@type": "Question",
        "name": "¿Qué puedo subir a mi biblioteca personal?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Material del que poseas los derechos legales: libros que hayas comprado (incluyendo ediciones digitales), material de dominio público, o texto con licencia que permita uso personal. Al subir declaras que tienes el derecho de usar ese material para tu estudio personal."
        }
      },
      {
        "@type": "Question",
        "name": "¿Qué incluye la biblioteca especializada?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Obras de dominio público y material con licencia explícita: comentarios clásicos (Calvino, Henry, Spurgeon, Agustín), léxicos académicos (Gesenius, Thayer, Strong), gramáticas y tratados patrísticos. Todo este material es citable públicamente."
        }
      },
      {
        "@type": "Question",
        "name": "¿Cómo funciona el enrutamiento de tutores?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Cuando haces una pregunta, un enrutador analiza el contenido y elige automáticamente al especialista adecuado. Si detecta una pregunta interdisciplinaria, puede consultar a varios tutores y sintetizar la respuesta manteniendo la atribución."
        }
      },
      {
        "@type": "Question",
        "name": "¿Qué pasa cuando termina el trial de 30 días?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Si no cancelas antes del día 30, se cobra automáticamente el primer mes del plan que elegiste. Puedes cancelar en cualquier momento desde tu cuenta sin letra chica. Si cancelas durante el trial, no se cobra nada."
        }
      },
      {
        "@type": "Question",
        "name": "¿Hay material gratuito para empezar a usar mejor el tiempo de estudio?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Sí. Puedes descargar gratis el manual de predicación expositiva en /recursos/manual-para-predicadores: una guía práctica para preparar sermones con metodología histórico-gramatical, fidelidad al texto y orden en el proceso de estudio."
        }
      }
