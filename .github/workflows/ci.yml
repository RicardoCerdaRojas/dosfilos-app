name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        # --ignore-engines because @dosfilos/functions pins node to "20"
        # exact and dev environments often run newer; matches the
        # leniency npm had before the migration.
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Run linter
        run: npm run lint
      
      - name: Type check
        run: npm run type-check
        continue-on-error: true  # Allow legacy TypeScript errors

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        # --ignore-engines because @dosfilos/functions pins node to "20"
        # exact and dev environments often run newer; matches the
        # leniency npm had before the migration.
        run: yarn install --frozen-lockfile --ignore-engines
      
      - name: Run unit tests
        run: npm run test:unit
        continue-on-error: true  # Allow legacy test failures
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        # --ignore-engines because @dosfilos/functions pins node to "20"
        # exact and dev environments often run newer; matches the
        # leniency npm had before the migration.
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build web app
        run: npm run build

      # La landing (Astro) se instala + construye DESPUÉS del web: sus deps (npm,
      # fuera de yarn.lock) no deben contaminar node_modules antes del build del
      # web. El root `npm run build` no toca la landing (su script es build:site).
      - name: Install + build landing (Astro)
        run: |
          npm install --prefix packages/landing --no-workspaces --no-audit --no-fund
          npm run build:site --prefix packages/landing

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: packages/web/dist
          retention-days: 7
