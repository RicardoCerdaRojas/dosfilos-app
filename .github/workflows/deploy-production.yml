name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy-production:
    name: Deploy to Firebase Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://preach.dosfilos.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      # La landing (paquete Astro) se instala con npm aparte: sus deps NO viven
      # en yarn.lock (aislamiento intencional; ver docs/Preach_SEO_descubribilidad.md §8.1).
      - name: Install landing (Astro) dependencies
        run: npm install --prefix packages/landing --no-workspaces --no-audit --no-fund

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # `npm run build` (root, --workspaces) construye el web app Y la landing
      # Astro (deps ya instaladas en el paso anterior).
      - name: Build web app + landing
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_MODEL_ID: "gemini-2.5-flash"
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}

      # Mapear los targets de hosting a sus sitios (.firebaserc está gitignored,
      # así que se aplican en el runner). El sitio `dosfilos-preach-marketing`
      # debe existir en el proyecto (paso de consola del fundador) ANTES del
      # primer deploy, o este paso/deploy falla por sitio inexistente.
      - name: Configure Hosting targets
        run: |
          firebase target:apply hosting app dosfilosapp --project ${{ secrets.FIREBASE_PROJECT_ID }}
          firebase target:apply hosting marketing dosfilos-preach-marketing --project ${{ secrets.FIREBASE_PROJECT_ID }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Deploy multi-site (CLI). Reemplaza action-hosting-deploy (single-site).
      - name: Deploy Hosting (app + marketing)
        run: firebase deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_ID }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_ID }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Auto-deploy Firestore rules + indexes whenever they change. Local
      # `firestore.indexes.json` was reconciled with production via
      # `firebase firestore:indexes` before this step was added — so the
      # union of remote-only + local-only indexes is preserved. Going
      # forward, ALL index changes must go through the local file (no more
      # creating indexes via Firebase Console) or this step will delete
      # them on the next deploy.
      - name: Deploy Firestore rules + indexes
        run: firebase deploy --only firestore:rules,firestore:indexes --project ${{ secrets.FIREBASE_PROJECT_ID }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Auto-deploy Storage rules whenever `storage.rules` changes. Was
      # missing from this workflow originally — local edits to the file
      # never reached production until someone ran a manual deploy. Caught
      # in May 2026 when the library upload cap bump (100MB → 250MB) sat
      # in the repo with no path to prod.
      - name: Deploy Storage rules
        run: firebase deploy --only storage --project ${{ secrets.FIREBASE_PROJECT_ID }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
