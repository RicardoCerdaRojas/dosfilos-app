<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@@TITULO_HOJA@@</title>
<style>
  /* suite-ensenanza-biblica · runtime diseño v5 · 2026-06-11 */
  /* @@FUENTES@@ */
  :root{
    --oscuro:#000A16; --panel:#001F34; --medio:#34586E; --acento:#00B8B0;
    --claro2:#D6EAF1; --tinta:#1a2b35; --escritura:#C9A227; --escritura-tinta:#8C6E14;
    --fuente:'Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--tinta);
    font-family:var(--fuente);
    font-size:15px;line-height:1.6}
  header.banda{background:var(--oscuro);padding:12px 26px;display:flex;align-items:center;gap:16px;
    border-bottom:4px solid var(--acento)}
  header.banda img{height:38px}
  header.banda .meta{color:var(--claro2);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  header.banda .meta strong{color:var(--acento)}
  .barra{background:#eef5f7;padding:8px 26px;font-size:13px;color:var(--medio);display:flex;gap:12px;align-items:center}
  .barra button{background:var(--medio);color:#fff;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;font-family:inherit;font-size:13px}
  .barra button:hover{background:var(--acento);color:var(--oscuro)}
  main{max-width:820px;margin:0 auto;padding:26px 26px 60px}
  h1{font-size:24px;color:var(--oscuro);border-left:6px solid var(--acento);padding-left:14px;margin:6px 0 2px;line-height:1.3}
  .subtitulo{color:var(--medio);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 14px;padding-left:20px}
  .datos{display:flex;gap:26px;font-size:14px;margin:10px 0 22px;flex-wrap:wrap}
  .datos span{border-bottom:1px solid var(--medio);min-width:240px;padding-bottom:2px}
  h2{font-size:16.5px;color:var(--claro2);background:var(--panel);padding:8px 14px;border-radius:6px;
    margin:26px 0 10px;display:flex;gap:10px;align-items:baseline}
  h2 .num{color:var(--acento);font-weight:800}
  h3{font-size:14px;color:var(--medio);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 4px}
  .escritura{font-style:italic;color:var(--escritura-tinta);background:#fffdf4;border:1px solid #efe3bd;
    border-left:4px solid var(--escritura);border-radius:6px;padding:12px 18px;margin:10px 0;font-size:15px;line-height:1.7}
  .escritura .ref{display:block;font-style:normal;color:var(--medio);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
  .blanco{display:inline-block;border-bottom:1.5px solid var(--tinta);min-width:150px;height:1.1em;vertical-align:bottom}
  .blanco.corto{min-width:90px}
  .blanco.largo{min-width:260px}
  .lineas{margin:8px 0 4px}
  .lineas div{border-bottom:1px solid #9db4bf;height:32px}
  .pregunta{border:1.4px dashed var(--acento);border-radius:6px;padding:10px 14px;margin:10px 0;background:#f4fbfa}
  .pregunta strong{color:var(--medio);font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:3px}
  .frase{background:var(--panel);color:var(--claro2);border-radius:8px;padding:12px 18px;margin:12px 0;font-weight:600;border-left:5px solid var(--acento)}
  .frase small{display:block;font-weight:400;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--acento);margin-bottom:4px}
  .frase .blanco{border-bottom-color:var(--claro2)}
  .sintesis{border:2px solid var(--acento);border-radius:10px;padding:14px 18px;margin:16px 0}
  .sintesis h3{margin-top:0;color:var(--acento)}
  ul{padding-left:20px;margin:6px 0}
  li{margin:6px 0}
  .griego{font-weight:700;font-style:italic;color:var(--medio)}
  footer{background:var(--oscuro);color:var(--claro2);text-align:center;padding:14px;font-size:11.5px;letter-spacing:.06em}
  footer strong{color:var(--acento)}
  @media print{
    .barra{display:none}
    body{font-size:12.5px}
    h2,.escritura,.pregunta,.frase,.sintesis{break-inside:avoid}
    main{padding:14px 8px}
  }

  /* @@COMPONENTES-FASE2@@ */
main .esc, main .esc-inline { color: var(--escritura-tinta); font-style: italic; }
main .esc-realce { color: var(--escritura-tinta); font-style: italic;
  text-decoration: underline; text-decoration-color: var(--acento);
  text-decoration-thickness: 2px; text-underline-offset: 4px; }
main .esc-num { color: var(--medio); font-size: .62em; font-style: normal;
  vertical-align: super; }
main .lexico { color: var(--medio); font-style: normal; font-weight: 700; }
main .cita-humana { color: #1a2b35; font-style: italic;
  border-left: 3px solid var(--medio); padding-left: 14px; }
main .cita-humana .atrib { color: var(--medio); font-style: normal;
  font-size: .85em; display: block; margin-top: 4px; }
main .ea-notas { margin-top: 12px; display: grid; gap: 6px; }
main .ea-nota { display: grid; grid-template-columns: 20px auto 1fr; gap: 10px;
  align-items: baseline; font-size: 14px;
  border-left: 3px solid var(--acento); padding: 6px 10px;
  background: #f2f7f9; border-radius: 5px; break-inside: avoid; }
main .ea-num { color: var(--acento); font-style: normal; font-weight: 800;
  font-size: .7em; vertical-align: super; }
main .ea-palabra { color: var(--escritura-tinta); font-style: italic;
  font-weight: 700; }
main .quiasmo { display: grid; gap: 5px; margin: 10px 0; break-inside: avoid; }
main .q-linea { display: grid; grid-template-columns: 36px 1fr; gap: 10px;
  align-items: baseline; font-size: 14.5px; padding: 5px 10px;
  border-left: 2px solid var(--medio); border-radius: 4px; }
main .q-linea.nivel-1 { margin-left: 36px; }
main .q-linea.nivel-2 { margin-left: 72px; }
main .q-linea.nivel-3 { margin-left: 108px; }
main .q-linea.nivel-4 { margin-left: 144px; }
main .q-etq { color: var(--medio); font-weight: 800; }
main .q-centro { background: #eef6f3; border-left-color: var(--acento);
  border-left-width: 4px; }
main .q-etq.blanco { color: transparent; border-bottom: 1.5px solid #94a8b3;
  min-width: 28px; display: inline-block; }
main .paralelo { display: grid; gap: 8px; margin: 10px 0; break-inside: avoid; }
main .par-fila { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px;
  align-items: center; font-size: 14.5px; }
main .par-a, main .par-b { background: #f2f7f9; padding: 8px 12px; border-radius: 6px;
  border: 1px solid #d5e2e8; }
main .par-rel { color: var(--medio); font-weight: 700; font-size: 12.5px;
  white-space: nowrap; }
main .flujo { display: grid; gap: 6px; margin: 10px 0; break-inside: avoid; }
main .f-nodo { display: grid; grid-template-columns: auto auto auto 1fr; gap: 9px;
  align-items: baseline; font-size: 14px; padding: 6px 10px;
  background: #f2f7f9; border-radius: 5px;
  border-left: 3px solid var(--medio); }
main .f-nodo.prof-1 { margin-left: 34px; }
main .f-nodo.prof-2 { margin-left: 68px; }
main .f-nodo.prof-3 { margin-left: 102px; }
main .f-conector { color: var(--medio); font-weight: 700; font-size: 12.5px; }
main .f-rol { color: var(--medio); text-transform: uppercase; font-size: 10.5px;
  letter-spacing: .05em; }
main .f-ref { color: var(--medio); font-size: 12px; }
main .f-nodo.rol-principal { border-left-color: var(--acento); }
main .f-nodo.rol-contraste { border-left-color: var(--alerta); }
main .termino { border: 1px solid #d5e2e8; border-radius: 9px;
  padding: 12px 16px; display: grid; gap: 6px; margin: 10px 0;
  break-inside: avoid; background: #fbfdfe; }
main .t-cab { display: flex; gap: 12px; align-items: baseline; }
main .t-lema { font-size: 24px; }
main .t-translit { color: #44606e; font-size: 14px; font-style: italic; }
main .t-morf { color: var(--medio); font-size: 11.5px; text-transform: uppercase;
  letter-spacing: .05em; }
main .t-glosa { font-size: 15px; }
main .t-rango { color: #44606e; font-size: 13.5px; }
main .t-usos { list-style: none; padding: 0; margin: 2px 0 0; display: grid;
  gap: 4px; font-size: 13px; color: #44606e; }
main .dv { display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  margin: 10px 0; break-inside: avoid; }
main .dv > div { border: 1px solid #d5e2e8; border-radius: 8px; padding: 10px 14px; }
main .dv h4 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase;
  letter-spacing: .06em; }
main .dv .despojar h4 { color: var(--alerta); }
main .dv .vestir h4 { color: var(--acento); }
main .tareas { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 8px; }
main .tareas li { display: grid; grid-template-columns: 22px 1fr; gap: 10px;
  align-items: start; font-size: 14.5px; }
main .tareas li::before { content: ""; width: 15px; height: 15px;
  border: 1.6px solid var(--medio); border-radius: 3px; margin-top: 2px; }
main .memorizar { border: 2px solid var(--acento); border-radius: 10px;
  padding: 12px 16px; margin: 12px 0; break-inside: avoid; }
main .memorizar .rotulo { font-size: 11px; text-transform: uppercase;
  letter-spacing: .08em; color: var(--medio); display: block;
  margin-bottom: 4px; }
  /* @@FIN-COMPONENTES-FASE2@@ */

  /* @@DISENO-V4@@ (base v2 + bloque impreso v4) */
.diapo { overflow:hidden; } 
.diapo ul.lista.lista-compacta { font-size:27px; } 
main h1 {
  font-family: var(--fuente-titulos, Georgia, 'Times New Roman', serif);
  font-weight:700; letter-spacing:.015em; line-height:1.12; }
main h2 {
  font-family: var(--fuente-titulos, Georgia, serif);
  font-weight:600; letter-spacing:.005em; }
main h2 .num {
  font-family: var(--fuente, sans-serif);
  border-radius:2px; letter-spacing:.08em; }
main .subtitulo { letter-spacing:.04em; }
main .escritura, main .esc, main .esc-inline, main .esc-realce {
  font-family: var(--fuente-escritura, var(--fuente-titulos, Georgia, serif)); }
main .escritura { font-size:1.18em; line-height:1.6; }
main .q-texto, main .par-a, main .par-b, main .f-texto {
  font-family: var(--fuente-escritura, var(--fuente-titulos, Georgia, serif));
  font-style:italic; }
main .q-etq { font-family: var(--fuente-titulos, Georgia, serif); font-style:normal; }
main .memorizar { border-radius:2px; border-width:1px; outline:1px solid var(--acento);
  outline-offset:4px; }
main .memorizar .esc { font-size:1.12em; }
main .termino, main .ea-nota, main .f-nodo, main .dv > div { border-radius:2px; }
main footer { letter-spacing:.06em; }
  
/* @@DISENO-V4-IMPRESO@@ — tarjetas y pasos en papel */
#cuerpo .tarjetas { display:grid; gap:14px; margin:10px 0; break-inside:avoid; }
#cuerpo .tarjetas.n2 { grid-template-columns:repeat(2,1fr); }
#cuerpo .tarjetas.n3 { grid-template-columns:repeat(3,1fr); }
#cuerpo .tarjetas.n4 { grid-template-columns:repeat(2,1fr); }
#cuerpo .tarjeta { border:1px solid #c8d4da; padding:12px 14px; }
#cuerpo .tj-titulo { font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  font-size:13px; border-bottom:1px solid #d5e2e8; padding-bottom:6px; margin-bottom:8px; }
#cuerpo .tj-fila { font-size:13px; margin:4px 0; }
#cuerpo .tj-fila .etq { display:block; font-size:10px; letter-spacing:.08em;
  text-transform:uppercase; color:#6b7d88; font-weight:700; }
#cuerpo .tj-realce { font-weight:700; font-size:14px; margin:6px 0 2px; }
#cuerpo .tj-nota { font-size:11px; color:#6b7d88; margin-top:6px; }
#cuerpo .pasos { display:flex; align-items:stretch; gap:8px; margin:10px 0; break-inside:avoid; }
#cuerpo .paso { flex:1; border:1px solid #c8d4da; padding:10px 12px; text-align:center; }
#cuerpo .paso .p-titulo { font-weight:800; font-size:13px; }
#cuerpo .paso .p-sub { font-size:12px; }
#cuerpo .paso.p-realce { border-width:2px; }
#cuerpo .paso-con { align-self:center; width:18px; text-align:center; }
#cuerpo .paso-con::after { content:"\2192"; color:#6b7d88; }
/* @@FIN-DISENO-V4@@ */
</style>
</head>
<body>

<header class="banda">
  <img src="data:image/png;base64,@@LOGO_B64@@" alt="La Iglesia · 1ra de Concepción">
  <div class="meta">@@META_HOJA@@</div>
</header>

<div class="barra">
  <button onclick="window.print()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="14" height="14" style="vertical-align:-2px"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Imprimir</button>
  <span>Siga la numeración de bloques: es la misma de la proyección.</span>
</div>

<main>@@CUERPO_HOJA@@</main>

<footer>@@FOOTER@@</footer>

</body>
</html>
